# Ambiente local do sacibras. Separado do finance_agent de propósito:
# nome de projeto, container, porta e volume próprios (fa_postgres usa 5433 e fa_pgdata).
name: sacibras

services:
  db:
    # Cache de séries só para desenvolvimento. Produção (GitHub Pages) não usa banco.
    image: postgres:16-alpine
    container_name: sb_postgres
    environment:
      POSTGRES_USER: ${SB_DB_USER:-sacibras}
      POSTGRES_PASSWORD: ${SB_DB_PASSWORD:-sacibras}
      POSTGRES_DB: ${SB_DB_NAME:-sacibras}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      TZ: UTC
    ports:
      - "5434:5432"
    volumes:
      - sb_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SB_DB_USER:-sacibras} -d ${SB_DB_NAME:-sacibras}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Roda uma vez e sai: `docker compose run --rm builder`. Grava os JSONs no volume que o
  # site lê. O cache de downloads fica num volume próprio, para iterar sem martelar as APIs.
  builder:
    build:
      context: .
      dockerfile: docker/builder.Dockerfile
    container_name: sb_builder
    environment:
      SB_CACHE_HORAS: ${SB_CACHE_HORAS:-6}
    volumes:
      - sb_dados:/dados
      - sb_cache:/cache
    profiles: ["builder"]

  # O site em http://localhost:5173, com recarga ao editar web/src.
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    container_name: sb_web
    ports:
      - "5173:5173"
    volumes:
      - ./web/src:/app/web/src
      - ./web/index.html:/app/web/index.html
      - sb_dados:/app/web/public/data

volumes:
  sb_pgdata:
  sb_dados:
  sb_cache:
