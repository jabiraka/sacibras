name: Gerar e publicar

# O builder chama as fontes, o Vite monta o site e o resultado vai ao GitHub Pages como
# artefato: nenhum dado é commitado. Horários em UTC (Brasília = UTC-3).
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "40 12 * * *" # 9h40, todo dia: depois do IBGE (9h) e do Focus (segunda, 8h25)
    - cron: "0 22 * * *" # 19h, todo dia: depois do fechamento do mercado

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write # a issue "fonte fora do ar" (.github/scripts/aviso.js)

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # O build completo passou de 20 min em 20/11/2026 e as rodadas agendadas foram canceladas
    # (o site ficou sem atualizar). Com folga: o limite do GitHub para o job é 6 h.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # O CSV do Tesouro Direto tem 15 MB e muda uma vez por dia: fica no cache do Actions.
      - uses: actions/cache@v4
        with:
          path: builder/.cache
          key: fontes-${{ github.run_id }}
          restore-keys: fontes-

      # A rodada anterior: os JSONs do site no ar vêm para web/public/data antes do build.
      # Seção cuja fonte falha fica com o dado do dia anterior, e peça que faltou numa seção
      # que saiu também (Caio, 14/11/2026: "nunca deixe em branco os valores"). Se o site não
      # responder, o build segue como antes.
      - name: Trazer a rodada anterior
        working-directory: builder
        run: |
          uv sync --frozen --no-dev
          uv run --no-dev sacibras anterior

      - name: Gerar os JSONs
        working-directory: builder
        env:
          SB_CACHE_HORAS: "1"
        run: uv run --no-dev sacibras build --tolerante --falhas falhas.md

      # Fonte que falhou não derruba o site (--tolerante) e o número fica o do dia anterior:
      # abre ou atualiza a issue "fonte fora do ar", e fecha quando todas voltam. Só no main,
      # para não confundir com teste de branch.
      - name: Avisar fonte fora do ar
        if: github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const corpo = fs.readFileSync("builder/falhas.md", "utf8");
            const n = corpo.split("\n").filter((l) => l.startsWith("| ") && !l.startsWith("| Seção") && !l.startsWith("| ---")).length;
            await require("./.github/scripts/aviso.js")({ github, context }, {
              rotulo: "fonte fora do ar",
              cor: "d73a4a",
              titulo:
                n > 0
                  ? `Fonte fora do ar: ${n} ${n === 1 ? "seção falhou" : "seções falharam"} no build`
                  : "Fonte fora do ar: parte dos números ficou com o dado anterior",
              explicacao:
                "O build das 9h40 e das 19h publica o site mesmo com fonte falhando, e o que a " +
                "fonte não refez fica com o dado da rodada anterior (o site no ar), com a data " +
                "de referência de antes. Esta issue fecha sozinha quando todas voltarem. Para " +
                "testar a fonte: `uv run sacibras build --secao <id>`.",
              corpo,
            });

      - name: Montar o site
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
