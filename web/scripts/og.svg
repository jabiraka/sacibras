<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- A imagem de compartilhamento (og:image): a marca, o nome e o lema, nas cores do site.
       Fonte desta figura; o PNG (public/og.png) sai de `npm run og`. -->
  <defs>
    <filter id="borra" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="90" />
    </filter>
  </defs>
  <rect width="1200" height="630" fill="#f4f2e8" />
  <!-- As luzes de fundo: verde, amarela e azul. -->
  <g filter="url(#borra)">
    <circle cx="110" cy="70" r="270" fill="#0e9f55" opacity="0.3" />
    <circle cx="1180" cy="330" r="200" fill="#ffd400" opacity="0.16" />
    <circle cx="560" cy="700" r="240" fill="#1f4fb8" opacity="0.2" />
  </g>
  <!-- A marca: o losango amarelo, o círculo azul e a linha que sobe. -->
  <g transform="translate(96 112) scale(2.5)">
    <polygon points="24,3 45,24 24,45 3,24" fill="#ffd400" />
    <circle cx="24" cy="24" r="10.5" fill="#0b2a6f" />
    <polyline points="15.5,27.5 20.5,24 24.5,26 32.5,19.5" fill="none" stroke="#fff"
      stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  <text x="236" y="190" font-family="Geist Variable, sans-serif" font-size="46" font-weight="600"
    letter-spacing="-1" fill="#14261c">sacibras</text>
  <text font-family="Geist Variable, sans-serif" font-size="84" font-weight="600"
    letter-spacing="-3.4" fill="#14261c">
    <tspan x="96" y="356">Status da</tspan>
    <tspan x="96" y="446" fill="rgb(20 38 28 / 42%)">economia brasileira</tspan>
  </text>
  <text x="98" y="530" font-family="Geist Variable, sans-serif" font-size="28" fill="rgb(20 38 28 / 72%)">PIB, inflação, juros, emprego, dólar e dívida, com fonte oficial e data.</text>
  <rect x="96" y="566" width="64" height="5" rx="2.5" fill="#00853a" />
</svg>
